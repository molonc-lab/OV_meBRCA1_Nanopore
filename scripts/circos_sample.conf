

<colors>
<<include etc/colors.conf>>
</colors>

<fonts>
<<include etc/fonts.conf>>
</fonts>

<<include /working/lab_olgak/lijunX/circos/conf/ideogram.conf>>
<<include /working/lab_olgak/lijunX/circos/conf/ticks.conf>>
<<include /working/lab_olgak/lijunX/circos/conf/karyotype.and.layout.conf>>
<<include /working/lab_olgak/lijunX/circos/conf/housekeeping.conf>>

data_out_of_range* = trim
<image>
dir =   /working/lab_olgak/lijunX/OV_meBRCA1_Nanopore/output/circos/
file  =   SampleID.circos.png
24bit = yes
png = yes
svg = no
# radius of inscribed circle in image
radius         = 2000p
background     = white
# by default angle=0 is at 3 o'clock position
angle_offset   = -90
#angle_orientation = counterclockwise

auto_alpha_colors = yes
auto_alpha_steps  = 5
</image>


<plots>

<plot> 	
#ASCAT_analysis_copy
show    =   yes
type    = histogram
file    =  /working/lab_olgak/lijunX/OV_meBRCA1_Nanopore/output/circos/SampleID_savana_copynumber.tsv

r0    = 0.88r
r1    = 0.98r

color = black
fill_under = yes
fill_color = black
thickness = 2
extend_bin = no

<axes>
<axis>
color     = vlgrey
thickness = 2
spacing=1
</axis>
</axes>

background       = no
background_color = lred
background_stroke_color = black
background_stroke_thickness = 2
min=-2
max=6

<rules>
<rule>
importance   = 100
condition    = var(value) > 0
color = dred
fill_color = dred
</rule>
<rule>
importance   = 85
condition    = var(value) < 0
color = dgreen
fill_color = dgreen
</rule>
</rules>
</plot>

<plot>
#ASCAT_analysis_BAF
show  =   yes
type  = scatter
file  = /working/lab_olgak/lijunX/OV_meBRCA1_Nanopore/output/circos/SampleID_savana_BAF.tsv

r0    = 0.76r
r1    = 0.86r

glyph = circle
glyph_size = 4
fill_color = black
stroke_color = black
stroke_thickness = 1

<axes>
<axis>

color     = lgrey
thickness = 2
spacing=0.25
</axis>
</axes>


background       = no
background_color = vvlgrey
background_stroke_color = black
background_stroke_thickness = 1

min   = 0.000
max   = 1.000
</plot>

<plot>
#MAF_mutations
show  =  no
type  = text
file  = test.tsv

r0    = 1r
r1    = 1r+500p

color = black
show_links     = yes
link_dims      = 0p,0p,50p,50p,10p
link_thickness = 3p
link_color     = black
label_size     = 24p
label_font     = condensed

label_snuggle  			= yes
max_snuggle_distance  		= 100r
snuggle_sampling       		= 10
snuggle_tolerance     		= 1r
snuggle_link_overlap_test 	= yes 
snuggle_link_overlap_tolerance 	= 1p
snuggle_refine            	= no

padding        = 0p
rpadding       = 0p

<rules>
<rule>
importance = 100
condition  = var(value) =~ /\\*|fs/
color = red
</rule>
</rules>
</plot>


</plots>

<links>
z      = 0
radius = 0.79r
crest  = 1

<link translocations>
show         =   yes
file         =   /working/lab_olgak/lijunX/OV_meBRCA1_Nanopore/output/circos/SampleID_nanomonSV_translocation.tsv

color        = dblue
thickness    = 5
radius = 0.75r
bezier_radius = 0.1r
bezier_radius_purity = 0.75
</link>

<link deletions>
show         =   yes
file         =   /working/lab_olgak/lijunX/OV_meBRCA1_Nanopore/output/circos/SampleID_nanomonSV_deletion.tsv 

color        = green
thickness    = 5
radius = 0.75r
bezier_radius = 0.1r
bezier_radius_purity = 0.75
</link>

<link inversions>
show         =  no
file         =  test.tsv

color        = yellow
thickness    = 5
radius = 0.75r
bezier_radius = 0.1r
bezier_radius_purity = 0.75
</link>

<link tandemdup>
show         =  no
file         =  test.tsv

color        = dred
thickness    = 5
radius = 0.75r
bezier_radius = 0.1r
bezier_radius_purity = 0.75
</link>

<link duplications>
show         = yes
file         = /working/lab_olgak/lijunX/OV_meBRCA1_Nanopore/output/circos/SampleID_nanomonSV_duplication.tsv

color        = red
thickness    = 5
radius = 0.75r
bezier_radius = 0.1r
bezier_radius_purity = 0.75
</link>

<link foldback>
show         = no
file         = test.tsv

color        = lorange
thickness    = 5
radius = 0.75r
bezier_radius = 0.1r
bezier_radius_purity = 0.75
</link>

<link ampinversions>
show         = no
file         = test.tsv

color        = dorange
thickness    = 5
radius = 0.75r 
bezier_radius = 0.1r
bezier_radius_purity = 0.75
</link>


<link intrchromosomal>
show         =   yes
file         = /working/lab_olgak/lijunX/OV_meBRCA1_Nanopore/output/circos/SampleID_nanomonSV_intrachromosomal.tsv 

color        = vlblue
thickness    = 5
radius = 0.75r
bezier_radius = 0.1r
bezier_radius_purity = 0.75
</link>

<rules>
## remap the color of the link to the first chromosome
<rule>
importance = 100
condition  = 1
color      = eval("chr".substr(_CHR1_,2))
flow       = continue
</rule>
</rules>
</links>
